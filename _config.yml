################################################
# SETUP
################################################

permalink: blog/:year/:month/:day/:title
# research.md, white_papers.md and assets are template samples: kept in the repo, not published.
exclude: ["Makefile", "README.md", "research.md", "white_papers.md", "assets"]

# Build settings
markdown: kramdown
highlighter: rouge

# Settings for analytics helper
# Set 'provider' to the analytics provider you want to use.
# Set 'provider' to false to turn analytics off globally.
#
analytics:
    provider: false
    statcounter:
        sc_project  :
        sc_security :
        sc_invisible: 1
        sc_text     : 2
    google:
        tracking_id: ''

plugins:
  - jekyll-seo-tag

#################################################
# CUSTOMIZATION
#################################################

title: Meichen Chen
description: Meichen Chen | Ph.D. Candidate in Economics | Yale University

url: "https://meichen-chen.github.io"
baseurl: ""

# start year for copyright
start_year: "2026"

colors:
  background: "#FFFFFF;"
  separator: "#042352;"

author:
    name: "Meichen Chen"

# manage your co-authors from here
coauthors:
